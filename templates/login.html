
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CourtEase</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 38px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .brand {
            color: #233e70;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
        }

        h2 {
            text-align: center;
            color: #26334a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #7b8495;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #344054;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dbe5;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #b8c9ee;
            border-color: #385a91;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #233e70;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #172d54;
        }

        .message {
            background: #fff0ed;
            color: #9a3024;
            padding: 10px;
            border-radius: 7px;
            margin: 12px 0;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #667085;
            font-size: 14px;
        }

        a {
            color: #233e70;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand">⚖ CourtEase</div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                required
                autocomplete="username"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Login</button>
        </form>

        <div class="register-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </div>
    </div>
</body>
</html>
